apply plugin: 'com.android.application'

def signingPropertiesFile = rootProject.file("keystore.properties")
def signingProperties = new Properties()
if (signingPropertiesFile.exists()) {
    signingProperties.load(new FileInputStream(signingPropertiesFile))
    def requiredSigningProperties = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
    def missingSigningProperties = requiredSigningProperties.findAll {
        !signingProperties[it]?.toString()?.trim()
    }
    if (!missingSigningProperties.isEmpty()) {
        throw new GradleException(
            "Missing Android signing properties: ${missingSigningProperties.join(', ')}"
        )
    }
}

android {
    namespace = "br.com.mercadofacil.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "br.com.mercadofacil.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (signingPropertiesFile.exists()) {
                storeFile rootProject.file(signingProperties["storeFile"])
                storePassword signingProperties["storePassword"]
                keyAlias signingProperties["keyAlias"]
                keyPassword signingProperties["keyPassword"]
            }
        }
    }
    buildTypes {
        release {
            if (signingPropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

tasks.register("verifyMercadoFacilReleaseConfig") {
    doLast {
        def metadataFile = file("src/main/assets/mercado-facil-build.json")
        def capacitorConfigFile = file("src/main/assets/capacitor.config.json")
        if (!metadataFile.exists() || !capacitorConfigFile.exists()) {
            throw new GradleException(
                "Run npm run build:android before creating a release bundle."
            )
        }

        def metadata = new groovy.json.JsonSlurper().parse(metadataFile)
        def apiUri = new URI(metadata.apiBaseUrl.toString())
        def apiHost = apiUri.host?.toLowerCase()
        def capacitorConfig = new groovy.json.JsonSlurper().parse(capacitorConfigFile)
        def isLoopback = apiHost == "localhost" ||
            apiHost == "127.0.0.1" ||
            apiHost?.startsWith("127.") ||
            apiHost == "::1" ||
            apiHost == "0.0.0.0" ||
            apiHost?.endsWith(".localhost")
        def isExampleHost = apiHost == "example.com" ||
            apiHost?.endsWith(".example.com") ||
            apiHost?.endsWith(".invalid")
        def hasApiBasePath = apiUri.path?.replaceAll("/+\$", "")?.endsWith("/api")

        if (metadata.target != "production" ||
            apiUri.scheme != "https" ||
            !apiHost ||
            isLoopback ||
            isExampleHost ||
            !hasApiBasePath ||
            apiUri.userInfo ||
            apiUri.query ||
            apiUri.fragment ||
            capacitorConfig.server?.url ||
            capacitorConfig.android?.allowMixedContent ||
            capacitorConfig.android?.webContentsDebuggingEnabled) {
            throw new GradleException(
                "Release bundles require a production HTTPS API and a non-debug Capacitor configuration."
            )
        }
    }
}

tasks.configureEach {
    if (name == "preReleaseBuild") {
        dependsOn("verifyMercadoFacilReleaseConfig")
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
